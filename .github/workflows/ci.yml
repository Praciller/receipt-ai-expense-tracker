name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: python scripts/test_repo_guardrails.py
      - run: python scripts/check_repo_guardrails.py
      - name: Export review snapshot
        uses: actions/upload-artifact@v4
        with:
          name: review-snapshot
          path: .
          if-no-files-found: error
          retention-days: 1
