<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Portfolio Cafe receipt</title>
  <desc id="desc">A fictional receipt used only for the portfolio sample flow.</desc>
  <rect width="640" height="800" fill="#e2e8f0"/>
  <rect x="95" y="45" width="450" height="710" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="320" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">SYNTHETIC RECEIPT</text>
  <text x="320" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">Portfolio Cafe</text>
  <line x1="135" y1="190" x2="505" y2="190" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="135" y="240" font-family="Arial, sans-serif" font-size="22" fill="#334155">Iced coffee</text>
  <text x="505" y="240" text-anchor="end" font-family="Arial, sans-serif" font-size="22" fill="#0f172a">85.00</text>
  <text x="135" y="285" font-family="Arial, sans-serif" font-size="22" fill="#334155">Bread</text>
  <text x="505" y="285" text-anchor="end" font-family="Arial, sans-serif" font-size="22" fill="#0f172a">45.00</text>
  <line x1="135" y1="325" x2="505" y2="325" stroke="#cbd5e1" stroke-width="2"/>
  <text x="135" y="380" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">TOTAL THB</text>
  <text x="505" y="380" text-anchor="end" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">130.00</text>
  <text x="320" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#64748b">13/06/2568 · Fictional data</text>
  <rect x="155" y="535" width="330" height="100" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
  <text x="320" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">SAMPLE ONLY</text>
  <text x="320" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e40af">No sensitive receipt data</text>
</svg>
